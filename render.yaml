# Render blueprint for LockBench — a single Docker service that serves both the
# FastAPI backend and the built React frontend at one URL.
#
# In Render: New + -> Blueprint -> connect this repo (Render reads this file and the
# Dockerfile). Or: New + -> Web Service -> connect the repo -> Render auto-detects the
# Dockerfile -> Create. Nothing else to configure.
services:
  - type: web
    name: lockbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
